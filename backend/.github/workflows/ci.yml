name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py always targets postgresql://atlas:atlas@localhost:5433/atlas_test
      # (matching this service's POSTGRES_DB), regardless of this env var.
      DATABASE_URL: postgresql://atlas:atlas@localhost:5433/atlas_test
      JWT_SECRET_KEY: ci-secret
      S3_BUCKET: ci-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          black --check .
          flake8 app/

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
