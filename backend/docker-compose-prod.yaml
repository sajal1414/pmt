services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: atlas_backend
    environment:
      - DATABASE_URL=postgresql://postgres:Nfolks12345@database-1.cqydbemkscxr.us-east-2.rds.amazonaws.com:5432/atlas
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-atlas-prod-secret-key-2026}
      - JWT_EXPIRY_HOURS=24
      - S3_BUCKET=nfolks-atlas-prod
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=
      - CORS_ORIGINS=*
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - atlas_network

  frontend:
    build:
      context: ../nfolks-atlas-ui
      dockerfile: Dockerfile
    restart: always
    container_name: atlas_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - atlas_network

networks:
  atlas_network:
    driver: bridge
