services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Overrides the host-oriented DATABASE_URL in .env: inside the compose network the
      # app must reach Postgres by service name, not localhost/the host-mapped port.
      # S3_ENDPOINT_URL is NOT overridden here: generate_presigned_post/url are pure local
      # signing (no network round-trip), and the resulting URL is handed to the browser,
      # which runs on the host — so it must stay the host-reachable http://localhost:9000
      # from .env, not the compose-internal "minio" service name.
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas}@postgres:5432/atlas
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      # Bucket-level CORS (`mc cors set`) isn't implemented on this MinIO build — this
      # server-wide setting is what actually lets the browser PUT/GET presigned URLs
      # cross-origin from the Vite dev server.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:5174,http://localhost:5175"
    ports:
      - "9000:9000" # S3 API — also the origin the browser uploads/downloads through directly
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin123} &&
      mc mb -p local/${S3_BUCKET:-nfolks-atlas-dev} &&
      mc anonymous set download local/${S3_BUCKET:-nfolks-atlas-dev}
      "

volumes:
  pgdata:
  miniodata:
